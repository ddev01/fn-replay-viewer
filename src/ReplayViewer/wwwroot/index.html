<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Replay Viewer</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <h1 class="sr-only">Replay Viewer</h1>
    <p id="status" class="status" hidden></p>
    <div id="demos-backdrop" class="demos-backdrop" hidden></div>
    <aside id="demos-panel" class="demos-panel" hidden>
      <div class="demos-head">
        <h2>Recent demos</h2>
        <button id="close-demos" type="button" class="ghost">Close</button>
      </div>
      <ul id="demos"></ul>
    </aside>
    <main>
      <div id="update-banner" class="update-banner" hidden>
        <div>
          <strong id="update-title"></strong>
          <span id="update-detail"></span>
        </div>
        <button id="update-apply" type="button" class="primary">Update now</button>
      </div>
      <section id="summary" class="summary" hidden></section>
      <div class="toolbar">
        <button
          id="toggle-demos"
          type="button"
          class="menu-btn"
          aria-label="Demos"
          aria-expanded="false"
          aria-controls="demos-panel"
          title="Demos"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4 5h16" />
            <path d="M4 12h16" />
            <path d="M4 19h16" />
          </svg>
        </button>
        <label class="search">
          <input id="search" type="search" placeholder="Player name" aria-label="Search roster" />
        </label>
        <div class="sort" role="group" aria-label="Sort teams">
          <span class="sort-label">Sort teams</span>
          <button type="button" id="sort-placement" class="active">Placement</button>
          <button type="button" id="sort-kills">Kills</button>
        </div>
        <label class="toggle">
          <input type="checkbox" id="show-bots" />
          Show bots
        </label>
      </div>
      <div id="roster" class="roster"></div>
      <section class="timelines" id="timeline-section">
        <div class="tabs">
          <button type="button" data-tab="game">Game</button>
          <button type="button" data-tab="you" class="active">You</button>
          <button type="button" data-tab="team">Team</button>
        </div>
        <div class="filters">
          <label><input type="checkbox" id="hide-bots" checked /> Hide bots in timeline</label>
          <label><input type="checkbox" id="only-you" /> Only fights that include you</label>
          <span id="you-filters" hidden>
            <label><input type="checkbox" id="flt-kills" checked /> Kills</label>
            <label><input type="checkbox" id="flt-knocks" checked /> Knocks</label>
            <label><input type="checkbox" id="flt-deaths" checked /> Deaths</label>
          </span>
          <span id="team-filters" hidden>
            <label><input type="checkbox" id="team-kills" checked /> Kills</label>
            <label><input type="checkbox" id="team-knocks" checked /> Knocks</label>
            <label><input type="checkbox" id="team-deaths" checked /> Deaths</label>
            <span id="team-players" class="team-players"></span>
          </span>
        </div>
        <ol id="timeline" class="timeline"></ol>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
