<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Replay Viewer</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <h1 class="sr-only">Replay Viewer</h1>
    <p id="status" class="status" role="status" hidden></p>
    <div id="demos-backdrop" class="demos-backdrop" hidden></div>
    <aside id="demos-panel" class="demos-panel" role="dialog" aria-modal="true" aria-label="Demos" hidden>
      <!-- One sticky block: the buttons and whatever they open stay in view while the list scrolls. -->
      <div class="demos-top">
      <div class="demos-head">
        <h2>Demos <span id="demos-count" class="demos-count"></span></h2>
        <div class="demos-actions">
          <button
            id="toggle-search"
            type="button"
            class="icon-btn"
            aria-expanded="false"
            aria-controls="demos-search"
            aria-label="Search player"
            title="Search player"
          >
            <svg class="solid" viewBox="0 0 640 640" aria-hidden="true" focusable="false">
              <path d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z" />
            </svg>
          </button>
          <button
            id="toggle-filters"
            type="button"
            class="icon-btn"
            aria-expanded="false"
            aria-controls="demos-filters"
            aria-label="Filters"
            title="Filters"
          >
            <!-- Sidebar icons: Font Awesome Free 7.3.1 (Icons: CC BY 4.0), https://fontawesome.com/license/free -->
            <svg class="solid" viewBox="0 0 640 640" aria-hidden="true" focusable="false">
              <path d="M96 128C78.3 128 64 142.3 64 160C64 177.7 78.3 192 96 192L182.7 192C195 220.3 223.2 240 256 240C288.8 240 317 220.3 329.3 192L544 192C561.7 192 576 177.7 576 160C576 142.3 561.7 128 544 128L329.3 128C317 99.7 288.8 80 256 80C223.2 80 195 99.7 182.7 128L96 128zM96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L342.7 352C355 380.3 383.2 400 416 400C448.8 400 477 380.3 489.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L489.3 288C477 259.7 448.8 240 416 240C383.2 240 355 259.7 342.7 288L96 288zM96 448C78.3 448 64 462.3 64 480C64 497.7 78.3 512 96 512L150.7 512C163 540.3 191.2 560 224 560C256.8 560 285 540.3 297.3 512L544 512C561.7 512 576 497.7 576 480C576 462.3 561.7 448 544 448L297.3 448C285 419.7 256.8 400 224 400C191.2 400 163 419.7 150.7 448L96 448z" />
            </svg>
            <span id="filter-count" class="filter-badge" hidden></span>
          </button>
          <button
            id="toggle-select"
            type="button"
            class="icon-btn"
            aria-pressed="false"
            aria-label="Select replays"
            title="Select replays"
          >
            <svg class="solid" viewBox="0 0 448 512" aria-hidden="true" focusable="false">
              <path d="M384 32c35.3 0 64 28.7 64 64l0 320c0 35.3-28.7 64-64 64L64 480c-35.3 0-64-28.7-64-64L0 96C0 60.7 28.7 32 64 32l320 0zM342 145.7c-10.7-7.8-25.7-5.4-33.5 5.3L189.1 315.2 137 263.1c-9.4-9.4-24.6-9.4-33.9 0s-9.4 24.6 0 33.9l72 72c5 5 11.9 7.5 18.8 7s13.4-4.1 17.5-9.8L347.3 179.2c7.8-10.7 5.4-25.7-5.3-33.5z" />
            </svg>
          </button>
          <button
            id="toggle-settings"
            type="button"
            class="icon-btn"
            aria-expanded="false"
            aria-controls="demos-settings"
            aria-label="Settings"
            title="Settings"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <button id="close-demos" type="button" class="icon-btn" aria-label="Close" title="Close">
            <svg class="solid" viewBox="0 0 640 640" aria-hidden="true" focusable="false">
              <path d="M183.1 137.4C170.6 124.9 150.3 124.9 137.8 137.4C125.3 149.9 125.3 170.2 137.8 182.7L275.2 320L137.9 457.4C125.4 469.9 125.4 490.2 137.9 502.7C150.4 515.2 170.7 515.2 183.2 502.7L320.5 365.3L457.9 502.6C470.4 515.1 490.7 515.1 503.2 502.6C515.7 490.1 515.7 469.8 503.2 457.3L365.8 320L503.1 182.6C515.6 170.1 515.6 149.8 503.1 137.3C490.6 124.8 470.3 124.8 457.8 137.3L320.5 274.7L183.1 137.4z" />
            </svg>
          </button>
        </div>
      </div>

      <div id="demos-search" class="demos-search" hidden>
        <input type="search" id="player-search" class="field" placeholder="Search player" aria-label="Search player" autocomplete="off" spellcheck="false" />
        <button id="player-search-clear" type="button" class="icon-btn small" aria-label="Clear search" title="Clear search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>

      <div id="demos-settings" class="demos-filters" hidden>
        <span class="filters-title">Settings</span>
        <label class="check-label"><input type="checkbox" id="hide-bots" class="check" checked /><span>Hide bots</span></label>
      </div>

      <div id="demos-select-bar" class="select-bar" hidden>
        <label class="check-label"><input type="checkbox" id="select-all" class="check" /><span>Select all</span></label>
        <span id="select-count" class="select-count" role="status"></span>
        <button id="delete-selected" type="button" class="btn danger small" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" />
          </svg>
          Delete
        </button>
      </div>
      <div id="demos-confirm" class="confirm-sheet" role="alertdialog" aria-labelledby="confirm-text" hidden>
        <p id="confirm-text"></p>
        <div class="confirm-actions">
          <button id="confirm-no" type="button" class="btn">No</button>
          <button id="confirm-yes" type="button" class="btn danger solid">Yes, delete</button>
        </div>
      </div>


      <div id="demos-filters" class="demos-filters" hidden>
        <div class="filters-top">
          <span class="filters-title">Filters</span>
          <button
            id="toggle-accounts"
            type="button"
            class="icon-btn small"
            aria-expanded="false"
            aria-controls="filter-accounts"
            aria-label="Accounts"
            title="Accounts"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" />
            </svg>
          </button>
          <button id="filters-reset" type="button" class="link-btn">Reset</button>
        </div>

        <section id="filter-accounts" class="filter-accounts" aria-label="Accounts" hidden>
          <p class="hint">Unchecked accounts stay hidden, even after a restart. Names stay masked until you reveal them.</p>
          <div id="account-list" class="account-list"></div>
          <div id="account-confirm" class="inline-confirm" role="alertdialog" aria-labelledby="account-confirm-text" hidden>
            <p id="account-confirm-text">Show this account name on screen? Anyone watching could read it.</p>
            <div class="confirm-actions">
              <button id="account-confirm-no" type="button" class="btn small">Cancel</button>
              <button id="account-confirm-yes" type="button" class="btn small solid">Show name</button>
            </div>
          </div>
        </section>

        <form id="filters-form" class="filters-form">
          <fieldset class="group">
            <legend>Mode</legend>
            <div class="chips">
              <label class="fchip"><input type="checkbox" data-filter="sizes" value="solo" /><span>Solo</span></label>
              <label class="fchip"><input type="checkbox" data-filter="sizes" value="duos" /><span>Duos</span></label>
              <label class="fchip"><input type="checkbox" data-filter="sizes" value="trios" /><span>Trios</span></label>
              <label class="fchip"><input type="checkbox" data-filter="sizes" value="squads" /><span>Squads</span></label>
            </div>
          </fieldset>
          <fieldset class="group">
            <legend>Type</legend>
            <div class="chips">
              <label class="fchip"><input type="checkbox" data-filter="ranked" value="ranked" /><span>Ranked</span></label>
              <label class="fchip"><input type="checkbox" data-filter="ranked" value="unranked" /><span>Unranked</span></label>
              <label class="fchip"><input type="checkbox" data-filter="builds" value="build" /><span>Build</span></label>
              <label class="fchip"><input type="checkbox" data-filter="builds" value="zerobuild" /><span>Zero build</span></label>
            </div>
          </fieldset>
          <fieldset id="filter-maps-group" class="group" hidden>
            <legend>Map</legend>
            <div id="filter-maps" class="chips"></div>
          </fieldset>
          <fieldset class="group">
            <legend>Date</legend>
            <div class="pair">
              <input type="date" id="filter-from" class="field" aria-label="From date" />
              <span class="dash" aria-hidden="true">to</span>
              <input type="date" id="filter-to" class="field" aria-label="To date" />
            </div>
          </fieldset>
          <fieldset class="group">
            <legend>Kills</legend>
            <div class="pair">
              <input type="number" id="filter-min-kills" class="field" min="0" inputmode="numeric" placeholder="Min" aria-label="Minimum kills" />
              <span class="dash" aria-hidden="true">to</span>
              <input type="number" id="filter-max-kills" class="field" min="0" inputmode="numeric" placeholder="Max" aria-label="Maximum kills" />
            </div>
          </fieldset>
        </form>
      </div>
      </div>

      <p id="demos-none" class="demos-none" hidden>No replays match these filters.</p>
      <ul id="demos"></ul>
    </aside>
    <main>
      <div id="update-banner" class="update-banner" hidden>
        <div>
          <strong id="update-title"></strong>
          <span id="update-detail"></span>
        </div>
        <button id="update-apply" type="button" class="primary">Update now</button>
      </div>
      <section id="empty" class="empty-state" hidden>
        <p id="empty-text"></p>
        <button id="empty-retry" type="button" class="primary">Try again</button>
        <button id="empty-demos" type="button">Pick a replay</button>
      </section>
      <div class="toolbar">
        <button
          id="toggle-demos"
          type="button"
          class="menu-btn"
          aria-label="Demos"
          aria-expanded="false"
          aria-controls="demos-panel"
          title="Demos"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4 5h16" />
            <path d="M4 12h16" />
            <path d="M4 19h16" />
          </svg>
        </button>
        <div class="sort" role="group" aria-label="Sort teams">
          <svg class="sort-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m3 16 4 4 4-4M7 20V4M11 4h10M11 8h7M11 12h4" />
          </svg>
          <button type="button" id="sort-placement" class="active" aria-pressed="true">Placement</button>
          <button type="button" id="sort-kills" aria-pressed="false">Kills</button>
        </div>
      </div>
      <div id="roster" class="roster"></div>
      <section class="timelines" id="timeline-section">
        <div class="tabs" role="group" aria-label="Timeline view">
          <button type="button" data-tab="you" class="active" aria-pressed="true">You</button>
          <button type="button" data-tab="team" aria-pressed="false">Team</button>
          <button type="button" data-tab="game" aria-pressed="false">Game</button>
        </div>
        <div class="filters">
          <label><input type="checkbox" id="only-you" /> Only fights that include you</label>
          <span id="you-filters" hidden>
            <label><input type="checkbox" id="flt-kills" checked /> Kills</label>
            <label><input type="checkbox" id="flt-knocks" checked /> Knocks</label>
            <label><input type="checkbox" id="flt-deaths" checked /> Deaths</label>
          </span>
          <span id="team-filters" hidden>
            <label><input type="checkbox" id="team-kills" checked /> Kills</label>
            <label><input type="checkbox" id="team-knocks" checked /> Knocks</label>
            <label><input type="checkbox" id="team-deaths" checked /> Deaths</label>
            <span id="team-players" class="team-players"></span>
          </span>
        </div>
        <ol id="timeline" class="timeline"></ol>
      </section>
      <section id="summary" class="summary" hidden></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
