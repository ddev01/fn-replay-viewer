name: CodeQL

on:
  # Only C# is analysed, so changes that touch no C# input skip the run.
  push:
    branches: [develop]
    paths:
      - "**.cs"
      - "**.csproj"
      - "**.props"
      - "**.targets"
      - "global.json"
      - "**/packages.lock.json"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [develop]
    paths:
      - "**.cs"
      - "**.csproj"
      - "**.props"
      - "**.targets"
      - "global.json"
      - "**/packages.lock.json"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          # No build: the extractor resolves the project itself, which skips a ~60s compile.
          build-mode: none
          # The test project runs its own loopback server, and its response writes are
          # structurally the sinks cs/web/xss looks for.
          config: |
            paths-ignore:
              - tests

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
