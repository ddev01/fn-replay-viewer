name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked)
        run: dotnet restore ReplayViewer.sln --locked-mode

      - name: Build
        run: dotnet build ReplayViewer.sln -c Release --nologo -warnaserror --no-restore

      - name: Test
        run: |
          Remove-Item -Recurse -Force artifacts/coverage -ErrorAction SilentlyContinue
          dotnet test ReplayViewer.sln -c Release --nologo --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage

      - name: Coverage gate
        run: |
          dotnet tool restore
          # One argument per threshold, no leading dash, no ';' separator.
          # The floor is 55% because a clean CI run reads ~58.4% line coverage while a local
          # Windows run reads ~62.2% (WinForms generated-code accounting differs). It still
          # catches a collapse; raise it only after confirming both numbers.
          dotnet tool run reportgenerator "-reports:artifacts/coverage/**/coverage.cobertura.xml" "-targetdir:artifacts/coverage/report" "-reporttypes:TextSummary" "minimumCoverageThresholds:lineCoverage=55" "minimumCoverageThresholds:branchCoverage=55"
          Get-Content artifacts/coverage/report/Summary.txt | Tee-Object -Variable summary | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $summary

      - name: Format
        run: dotnet format ReplayViewer.sln --verify-no-changes --no-restore

      # Frontend checks land with package.json; until then these steps skip.
      - name: npm ci
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Playwright browsers
        if: hashFiles('package.json') != ''
        run: npx --no-install playwright install chromium

      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint

      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: npm run typecheck

      - name: UI tests
        if: hashFiles('package.json') != ''
        run: npm run test:ui
