name: CI

# A branch with an open PR is covered by the pull_request run; pushing it as well would run
# everything twice on a paid Windows runner.
on:
  push:
    branches: [develop]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [develop]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked)
        run: dotnet restore ReplayViewer.sln --locked-mode

      - name: Build
        run: dotnet build ReplayViewer.sln -c Release --nologo -warnaserror --no-restore

      - name: Test
        run: |
          Remove-Item -Recurse -Force artifacts/coverage -ErrorAction SilentlyContinue
          # A hung test must fail the job, not sit in the queue: this catches a deadlock in 5m.
          dotnet test ReplayViewer.sln -c Release --nologo --no-build --blame-hang-timeout 5m --collect:"XPlat Code Coverage" --results-directory artifacts/coverage

      - name: Coverage gate
        run: |
          dotnet tool restore
          # One argument per threshold, no leading dash, no ';' separator.
          # Floor is two points under a clean CI run (65.0% line / 63.2% branch). A local run
          # reads ~67% / 66% because the two replay-dependent tests skip without a demo file.
          dotnet tool run reportgenerator "-reports:artifacts/coverage/**/coverage.cobertura.xml" "-targetdir:artifacts/coverage/report" "-reporttypes:TextSummary" "minimumCoverageThresholds:lineCoverage=63" "minimumCoverageThresholds:branchCoverage=61"
          Get-Content artifacts/coverage/report/Summary.txt | Tee-Object -Variable summary | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $summary

      - name: Format
        run: dotnet format ReplayViewer.sln --verify-no-changes --no-restore

  # Runs beside the .NET job instead of after it. The UI tests hit a stubbed API served by
  # node, so nothing here depends on Windows; Linux runners start faster and cost half as much.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      # Browser binaries only; keyed on the lockfile, so a Playwright bump refreshes them.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # --with-deps installs the OS libraries each run; the browser download is skipped on a cache hit.
      - name: Playwright browsers
        run: npx --no-install playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: UI tests
        run: npm run test:ui
