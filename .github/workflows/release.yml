name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pack:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: true

      - name: Test
        run: dotnet test ReplayViewer.sln -c Release --nologo

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Pack installer and zip
        env:
          NameFnPublicUrl: ${{ secrets.NAME_FN_PUBLIC_URL }}
        run: pwsh -File scripts/pack.ps1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/installer/ReplayViewer-Setup-*.exe
            artifacts/ReplayViewer-win-x64-*.zip

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $project = "src/ReplayViewer/ReplayViewer.csproj"
          $version = (dotnet msbuild $project -getProperty:Version -nologo).Trim()
          $setup = "artifacts/installer/ReplayViewer-Setup-$version.exe"
          $zip = "artifacts/ReplayViewer-win-x64-$version.zip"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$version"
          }

          $expected = "v$version"
          if ($tag -ne $expected) {
            throw "Tag $tag does not match project version $expected"
          }

          $notes = @"
          Download **ReplayViewer-Setup-$version.exe** and run it. No unzipping and no extra DLLs.

          The installer puts Replay Viewer in your user folder, adds a Start Menu shortcut, starts it at sign-in, and can launch it when setup finishes.
          "@

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # No --clobber: release assets are immutable, so re-uploading is
            # forbidden. A failed release needs a new tag, and the version guard
            # above keeps that deliberate.
            gh release upload $tag $setup $zip
          } else {
            gh release create $tag $setup $zip --title "Replay Viewer $version" --notes $notes
          }
