name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pack:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Test
        run: dotnet test ReplayViewer.sln -c Release --nologo

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Pack installer and zip
        env:
          NameFnPublicUrl: ${{ secrets.NAME_FN_PUBLIC_URL }}
        run: pwsh -File scripts/pack.ps1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/installer/ReplayViewer-Setup-*.exe
            artifacts/ReplayViewer-win-x64-*.zip

      - name: Verify the tag matches the project version
        run: |
          $project = "src/ReplayViewer/ReplayViewer.csproj"
          $version = (dotnet msbuild $project -getProperty:Version -nologo).Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$version"
          }

      # The release itself is published from the signing machine: the detached signature has to
      # be produced with a key that never reaches CI, and release assets are immutable once
      # published, so the .sig files must exist before the release is created.
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            artifacts/installer/ReplayViewer-Setup-*.exe
            artifacts/ReplayViewer-win-x64-*.zip
          if-no-files-found: error
