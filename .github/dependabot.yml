version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # 18.x switches to Microsoft.Testing.Platform, and VSTest is not a supported
      # target on .NET 10 SDK, so `dotnet test` fails with "Testing with VSTest target
      # is no longer supported". Moving to MTP is a deliberate migration: opt into the
      # new dotnet test experience, then update verify.ps1 and ci.yml.
      # xunit.v3 3.2.x is fine (CI verified); 4.x is blocked because it is grouped with
      # the same MTP move and has not been verified here.
      - dependency-name: Microsoft.NET.Test.Sdk
        versions: [">=18"]
      - dependency-name: xunit.v3
        versions: [">=4"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
